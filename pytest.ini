[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    unit: fast unit tests for pure logic
    api: HTTP/API behavior tests
    eval: model quality/regression tests
    slow: slower-running tests
    aws: tests that hit real AWS services
    localmodel: tests that load local model weights/inference
